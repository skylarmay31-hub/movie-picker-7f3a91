function save(){state.movies=library;localStorage.setItem(key,JSON.stringify(state))}function init(){library=state.movies.length?state.movies:EMBED;save();renderCount()}function active(){return library.filter(m=>!state.watched[m.url])}function pick(){const a=active();if(!a.length){document.getElementById('card').innerHTML='<div class="empty">想看库已经全部看完啦 🎉</div>';return}current=a[Math.floor(Math.random()*a.length)];document.getElementById('card').innerHTML=`<div class="dice">🎬</div><h1>${esc(current.title)}</h1><div class="meta"><div class="label">上映时间</div><div class="value">${esc(current.release)}</div><div class="label">导演</div><div class="value">${esc(current.director)}</div><div class="label">时长</div><div class="value">${esc(current.runtime)}</div><div class="label">语种</div><div class="value">${esc(current.language)}</div><div class="label">片型</div><div class="value">${esc(current.genres)}</div></div>`;document.getElementById('doneBtn').classList.remove('hidden');const d=document.getElementById('douban');d.href=current.url;d.classList.remove('hidden')}
function markDone(){if(!current)return;if(!confirm(`确认已看完《${current.title}》？`))return;state.watched[current.url]={movie:current,watchedAt:new Date().toISOString().slice(0,10)};save();current=null;document.getElementById('doneBtn').classList.add('hidden');document.getElementById('douban').classList.add('hidden');document.getElementById('card').innerHTML='<div class="empty">已标记为看完，不会再次抽到</div>';renderCount()}
function renderCount(){document.getElementById('count').textContent=`剩余 ${active().length} 部 · 已看 ${Object.keys(state.watched).length} 部`}function showTab(t){const hist=t==='history';document.getElementById('pickView').classList.toggle('hidden',hist);document.getElementById('historyView').classList.toggle('hidden',!hist);document.getElementById('pickTab').classList.toggle('on',!hist);document.getElementById('historyTab').classList.toggle('on',hist);if(hist)renderHistory()}
function renderHistory(){const a=Object.entries(state.watched).sort((x,y)=>y[1].watchedAt.localeCompare(x[1].watchedAt));document.getElementById('history').innerHTML=a.length?a.map(([url,x])=>`<div class="watched"><h3>${esc(x.movie.title)}</h3><div class="row"><input type="date" value="${x.watchedAt}" onchange="editDate('${encodeURIComponent(url)}',this.value)"><button class="small danger" onclick="undo('${encodeURIComponent(url)}')">删除标记</button></div></div>`).join(''):'<div class="card empty">还没有已看记录</div>'}function editDate(u,v){state.watched[decodeURIComponent(u)].watchedAt=v;save()}function undo(u){u=decodeURIComponent(u);if(!confirm('删除这条已看标记？电影会重新回到抽取库。'))return;delete state.watched[u];save();renderHistory();renderCount()}
function openSync(){document.getElementById('modal').style.display='flex'}function closeSync(){document.getElementById('modal').style.display='none'}async function refreshLibrary(){try{const r=await fetch('movies.json?t='+Date.now());if(!r.ok)throw 0;library=await r.json();save();renderCount();closeSync();alert(`已更新，共 ${library.length} 部`)}catch(e){alert('更新失败，请稍后再试或从文件导入。')}}function importFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{library=JSON.parse(r.result);save();renderCount();closeSync();alert(`导入成功，共 ${library.length} 部`)}catch(e){alert('文件格式不正确')}};r.readAsText(f)}function esc(s){return String(s||'未知').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();</script></body></html>
