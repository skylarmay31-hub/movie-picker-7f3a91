function save(){state.movies=library;localStorage.setItem(key,JSON.stringify(state))}function init(){library=state.movies.length?state.movies:EMBED;const valid=new Set(library.map(m=>m.url));state.drawn=state.drawn.filter(u=>valid.has(u));save();renderCount()}function active(){return library.filter(m=>!state.watched[m.url])}function cycleAvailable(){const seen=new Set(state.drawn);return active().filter(m=>!seen.has(m.url))}function secureIndex(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return Math.floor(a[0]/4294967296*n)}function pick(){const a=active();if(!a.length){document.getElementById('card').innerHTML='<div class="empty">想看库已经全部看完</div>';return}let pool=cycleAvailable();if(!pool.length){state.drawn=[];pool=a}current=pool[secureIndex(pool.length)];state.drawn.push(current.url);save();document.getElementById('card').innerHTML=`<div class="index">SELECTED / ${String(state.drawn.length).padStart(3,'0')}</div><div class="title">${esc(current.title)}</div><div class="info">${esc(current.release)} · ${esc(current.runtime)}<br>${esc(current.director)}<br>${esc(current.language)} · ${esc(current.genres)}</div>`;document.getElementById('doneBtn').classList.remove('hidden');const d=document.getElementById('douban');d.href=current.url;d.classList.remove('hidden');renderCount()}
function markDone(){if(!current)return;if(!confirm(`确认已看完《${current.title}》？`))return;state.watched[current.url]={movie:current,watchedAt:new Date().toISOString().slice(0,10)};save();current=null;document.getElementById('doneBtn').classList.add('hidden');document.getElementById('douban').classList.add('hidden');document.getElementById('card').innerHTML='<div class="empty">已标记为看完，不会再次抽到</div>';renderCount()}
function renderCount(){let left=cycleAvailable().length;if(!left&&active().length)left=active().length;document.getElementById('count').textContent=`片库 ${active().length} 部 · 本轮未抽 ${left} 部 · 已看 ${Object.keys(state.watched).length} 部`}function showTab(t){const hist=t==='history';document.getElementById('pickView').classList.toggle('hidden',hist);document.getElementById('historyView').classList.toggle('hidden',!hist);if(hist)renderHistory()}
function renderHistory(){const a=Object.entries(state.watched).sort((x,y)=>y[1].watchedAt.localeCompare(x[1].watchedAt));document.getElementById('history').innerHTML=a.length?a.map(([url,x])=>`<div class="watched"><h3>${esc(x.movie.title)}</h3><div class="row"><input type="date" value="${x.watchedAt}" onchange="editDate('${encodeURIComponent(url)}',this.value)"><button class="small danger" onclick="undo('${encodeURIComponent(url)}')">删除标记</button></div></div>`).join(''):'<div class="card empty">还没有已看记录</div>'}function editDate(u,v){state.watched[decodeURIComponent(u)].watchedAt=v;save()}function undo(u){u=decodeURIComponent(u);if(!confirm('删除这条已看标记？电影会重新回到抽取库。'))return;delete state.watched[u];state.drawn=state.drawn.filter(x=>x!==u);save();renderHistory();renderCount()}
function reshuffle(){if(!confirm('重新打乱会清空本轮抽取进度，确定继续吗？'))return;state.drawn=[];current=null;save();renderCount();document.getElementById('doneBtn').classList.add('hidden');document.getElementById('douban').classList.add('hidden');document.getElementById('card').innerHTML='<div class="index">RESHUFFLED / 310</div><div class="title">READY FOR A<br>NEW ROUND.</div><div class="info">片库已重新打乱，下一次抽取将开启新一轮。</div>'}function openSync(){document.getElementById('modal').style.display='flex'}function closeSync(){document.getElementById('modal').style.display='none'}async function refreshLibrary(){try{const r=await fetch('movies.json?t='+Date.now());if(!r.ok)throw 0;library=await r.json();save();renderCount();closeSync();alert(`已更新，共 ${library.length} 部`)}catch(e){alert('更新失败，请稍后再试或从文件导入。')}}function importFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{library=JSON.parse(r.result);save();renderCount();closeSync();alert(`导入成功，共 ${library.length} 部`)}catch(e){alert('文件格式不正确')}};r.readAsText(f)}function esc(s){return String(s||'未知').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();</script></body></html>
